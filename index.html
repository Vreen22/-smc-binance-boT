<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07100b">
<title>SMC Binance Signal Bot</title>

<style>
body{
margin:0;
background:#07100b;
color:#eaf7ee;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.wrap{
max-width:720px;
margin:auto;
padding:16px
}

.card{
background:#0d1711;
border:1px solid #203127;
border-radius:18px;
padding:16px;
margin:12px 0
}

h1{
font-size:23px;
margin:4px 0
}

.sub{
color:#93aa9a;
font-size:13px
}

.row{
display:flex;
gap:8px;
flex-wrap:wrap
}

select,button{
background:#132019;
color:#fff;
border:1px solid #304638;
border-radius:12px;
padding:11px 13px;
font-size:15px
}

button{
cursor:pointer
}

.status{
padding:8px 12px;
border-radius:20px;
background:#17251c;
color:#9ee0ae;
display:inline-block
}

.signal{
font-size:28px;
font-weight:800;
margin:8px 0
}

.buy{
color:#42e887
}

.sell{
color:#ff6978
}

.none{
color:#a7b7ad
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

.metric{
background:#101d15;
border-radius:12px;
padding:12px
}

.metric b{
display:block;
font-size:17px;
margin-top:4px
}

ul{
margin:8px 0;
padding-left:20px;
line-height:1.9
}

.small{
font-size:12px;
color:#91a498
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<h1>🧠 SMC Binance Signal Bot</h1>

<div class="sub">
Liquidity • BOS • CHoCH • FVG • EMA • RSI • ATR
</div>

</div>


<div class="card">

<div class="row">

<select id="symbol">

<option>BTCUSDT</option>

<option>ETHUSDT</option>

<option>SOLUSDT</option>

<option>BNBUSDT</option>

</select>


<select id="tf">

<option value="1m">
1 Min
</option>

<option value="5m" selected>
5 Min
</option>

<option value="15m">
15 Min
</option>

<option value="1h">
1 Hour
</option>

</select>


<button onclick="start()">
▶ Start
</button>


<button onclick="stop()">
■ Stop
</button>

</div>


<p>

<span id="status" class="status">
Disconnected
</span>

</p>

</div>


<div class="card">

<div id="signal" class="signal none">

NO SIGNAL

</div>


<div id="reason" class="small">

Waiting for SMC confirmation...

</div>

</div>


<div class="card grid">


<div class="metric">

Entry

<b id="entry">
—
</b>

</div>


<div class="metric">

Stop Loss

<b id="sl">
—
</b>

</div>


<div class="metric">

TP1

<b id="tp1">
—
</b>

</div>


<div class="metric">

TP2

<b id="tp2">
—
</b>

</div>


<div class="metric">

R:R

<b id="rr">
—
</b>

</div>


<div class="metric">

Confidence

<b id="conf">
—
</b>

</div>


</div>


<div class="card">

<b>
Confirmations
</b>


<ul id="checks">

<li>
Waiting for market history...
</li>

</ul>

</div>


<div class="card small">

AUTO TRADE: OFF — Signal-only version. No real-money trading.

</div>

</div>


<script>


let ws = null;

let candles = [];


const $ = id => document.getElementById(id);



/* =========================
EMA
========================= */

function ema(a,n){

if(!a.length)
return 0;

n=Math.min(n,a.length);

let k=2/(n+1);

let e=a[0];


for(let i=1;i<a.length;i++){

e=a[i]*k+e*(1-k);

}


return e;

}



/* =========================
RSI
========================= */

function rsi(a,n=14){

if(a.length<n+1)
return 50;


let gain=0;

let loss=0;


for(let i=a.length-n;i<a.length;i++){

let d=a[i]-a[i-1];


gain+=Math.max(d,0);

loss+=Math.max(-d,0);

}


if(loss===0)
return 100;


return 100-(100/(1+gain/loss));

}



/* =========================
ATR
========================= */

function atr(c,n=14){

if(c.length<n+1)
return 0;


let total=0;


for(let i=c.length-n;i<c.length;i++){

total+=Math.max(

c[i].h-c[i].l,

Math.abs(c[i].h-c[i-1].c),

Math.abs(c[i].l-c[i-1].c)

);

}


return total/n;

}



/* =========================
FORMAT PRICE
========================= */

function fmt(x){

return Number(x).toLocaleString(

undefined,

{
maximumFractionDigits:8
}

);

}



/* =========================
SMC ANALYSIS
========================= */

function analyze(){


if(candles.length<60){

$("reason").textContent=

"Loading candles: "+candles.length+"/60";

return;

}


let c=candles;


let closes=c.map(x=>x.c);


let last=c[c.length-1];


let ema50=ema(closes,50);


let ema200=ema(closes,200);


let RSI=rsi(closes,14);


let ATR=atr(c,14);



/* =========================
SWING LEVELS
========================= */

let recent=c.slice(-12);


let highs=
recent
.slice(0,-2)
.map(x=>x.h);


let lows=
recent
.slice(0,-2)
.map(x=>x.l);


let swingHigh=
Math.max(...highs);


let swingLow=
Math.min(...lows);



/* =========================
LIQUIDITY GRAB
========================= */

let liquidityGrabUp=

last.h>swingHigh &&
last.c<swingHigh;


let liquidityGrabDown=

last.l<swingLow &&
last.c>swingLow;



/* =========================
BOS
========================= */

let p=
c[c.length-2];


let pp=
c[c.length-3];


let bullishBOS=

last.c>p.h &&
p.h>pp.h;


let bearishBOS=

last.c<p.l &&
p.l<pp.l;



/* =========================
FVG
========================= */

let bullishFVG=

c.length>=4 &&
c[c.length-3].h<
c[c.length-1].l;


let bearishFVG=

c.length>=4 &&
c[c.length-3].l>
c[c.length-1].h;



/* =========================
BUY SCORE
========================= */

let buyScore=

(liquidityGrabDown ? 2 : 0)+

(bullishBOS ? 1 : 0)+

(bullishFVG ? 2 : 0)+

(ema50>ema200 ? 1 : 0)+

(RSI>50 ? 1 : 0);



/* =========================
SELL SCORE
========================= */

let sellScore=

(liquidityGrabUp ? 2 : 0)+

(bearishBOS ? 1 : 0)+

(bearishFVG ? 2 : 0)+

(ema50<ema200 ? 1 : 0)+

(RSI<50 ? 1 : 0);



/* =========================
CONFIRMATIONS
========================= */

$("checks").innerHTML=`

<li>

Liquidity Grab:

${
liquidityGrabDown ||
liquidityGrabUp

?

"✅ Confirmed"

:

"❌ Not confirmed"

}

</li>


<li>

BOS:

${
bullishBOS ||
bearishBOS

?

"✅ Confirmed"

:

"❌ Not confirmed"

}

</li>


<li>

FVG:

${
bullishFVG ||
bearishFVG

?

"✅ Confirmed"

:

"❌ Not confirmed"

}

</li>


<li>

EMA 50/200:

${
ema50>ema200

?

"Bullish 🟢"

:

"Bearish 🔴"

}

</li>


<li>

RSI 14:

${RSI.toFixed(1)}

</li>


<li>

ATR 14:

${fmt(ATR)}

</li>

`;



/* =========================
SIGNAL
========================= */

let side=null;


if(buyScore>=6){

side="BUY";

}

else if(sellScore>=6){

side="SELL";

}



if(!side){

$("signal").textContent=
"NO SIGNAL";


$("signal").className=
"signal none";


$("reason").textContent=
"Waiting for complete SMC confirmation...";


$("entry").textContent="—";

$("sl").textContent="—";

$("tp1").textContent="—";

$("tp2").textContent="—";

$("rr").textContent="—";

$("conf").textContent="—";


return;

}



/* =========================
ENTRY / SL / TP
========================= */

let entry=last.c;


let risk=Math.max(

ATR*1.2,

entry*0.001

);


let stop;

let tp1;

let tp2;


if(side==="BUY"){

stop=
entry-risk;

tp1=
entry+risk*1.5;

tp2=
entry+risk*2;

}

else{

stop=
entry+risk;

tp1=
entry-risk*1.5;

tp2=
entry-risk*2;

}



/* =========================
DISPLAY
========================= */

$("signal").textContent=

side==="BUY"

?

"🟢 BUY — SMC SIGNAL"

:

"🔴 SELL — SMC SIGNAL";


$("signal").className=

"signal "+

(side==="BUY" ? "buy" : "sell");


$("reason").textContent=

"Liquidity + Structure + FVG + Indicator confirmation";


$("entry").textContent=
fmt(entry);


$("sl").textContent=
fmt(stop);


$("tp1").textContent=
fmt(tp1);


$("tp2").textContent=
fmt(tp2);


$("rr").textContent=
"1 : 1.5 / 1 : 2";


let confidence=

Math.round(

Math.max(
buyScore,
sellScore
)/7*100

);


$("conf").textContent=
confidence+"%";

}



/* =========================
START BOT
========================= */

async function start(){


stop();


candles=[];


let symbol=
$("symbol").value;


let timeframe=
$("tf").value;


$("status").textContent=

"🟡 Loading market history...";



/* =========================
LOAD 250 HISTORICAL CANDLES
========================= */

try{


let url=

`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${timeframe}&limit=250`;


let response=
await fetch(url);


if(!response.ok){

throw new Error(
"Binance REST request failed"
);

}


let data=
await response.json();


/*

Remove last candle because it
may still be forming.

*/

candles=

data
.slice(0,-1)
.map(k=>({

o:+k[1],

h:+k[2],

l:+k[3],

c:+k[4],

v:+k[5]

}));



analyze();


}

catch(error){


$("status").textContent=

"🔴 History Load Error";


$("reason").textContent=

"Could not load Binance historical candles.";


console.error(error);


return;

}



/* =========================
LIVE WEBSOCKET
========================= */

let stream=

`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@kline_${timeframe}`;


ws=
new WebSocket(stream);



ws.onopen=()=>{


$("status").textContent=

"🟢 Binance Live";


analyze();

};



ws.onclose=()=>{


$("status").textContent=

"⚪ Disconnected";

};



ws.onerror=()=>{


$("status").textContent=

"🔴 Connection Error";

};



ws.onmessage=e=>{


let d=
JSON.parse(e.data);


let k=
d.k;



/*

Only analyze CLOSED candles.

*/

if(k.x){


candles.push({

o:+k.o,

h:+k.h,

l:+k.l,

c:+k.c,

v:+k.v

});


if(candles.length>250){

candles.shift();

}


analyze();

}

};

}



/* =========================
STOP
========================= */

function stop(){


if(ws){

ws.close();

ws=null;

}


$("status").textContent=

"⚪ Disconnected";

}



/* =========================
AUTO START
========================= */

start();

</script>

</body>
</html>
