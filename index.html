<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07100b">
<title>SMC Binance Signal Bot</title>

<style>
body{
  margin:0;
  background:#07100b;
  color:#eaf7ee;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
.wrap{
  max-width:720px;
  margin:auto;
  padding:16px
}
.card{
  background:#0d1711;
  border:1px solid #203127;
  border-radius:18px;
  padding:16px;
  margin:12px 0
}
h1{
  font-size:23px;
  margin:4px 0
}
.sub{
  color:#93aa9a;
  font-size:13px
}
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
select,button{
  background:#132019;
  color:#fff;
  border:1px solid #304638;
  border-radius:12px;
  padding:11px 13px;
  font-size:15px
}
button{
  cursor:pointer
}
.status{
  padding:8px 12px;
  border-radius:20px;
  background:#17251c;
  color:#9ee0ae;
  display:inline-block
}
.signal{
  font-size:28px;
  font-weight:800;
  margin:8px 0
}
.buy{
  color:#42e887
}
.sell{
  color:#ff6978
}
.none{
  color:#a7b7ad
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}
.metric{
  background:#101d15;
  border-radius:12px;
  padding:12px
}
.metric b{
  display:block;
  font-size:17px;
  margin-top:4px
}
ul{
  margin:8px 0;
  padding-left:20px;
  line-height:1.9
}
.small{
  font-size:12px;
  color:#91a498
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">
  <h1>🧠 SMC Binance Signal Bot</h1>
  <div class="sub">
    Liquidity • BOS • CHoCH • FVG • EMA • RSI • ATR
  </div>
</div>

<div class="card">

<div class="row">

<select id="symbol">
  <option>BTCUSDT</option>
  <option>ETHUSDT</option>
  <option>SOLUSDT</option>
  <option>BNBUSDT</option>
</select>

<select id="tf">
  <option value="1m">1 Min</option>
  <option value="5m" selected>5 Min</option>
  <option value="15m">15 Min</option>
  <option value="1h">1 Hour</option>
</select>

<button onclick="start()">▶ Start</button>
<button onclick="stop()">■ Stop</button>

</div>

<p>
<span id="status" class="status">
Disconnected
</span>
</p>

</div>

<div class="card">

<div id="signal" class="signal none">
NO SIGNAL
</div>

<div id="reason" class="small">
Waiting for SMC confirmation...
</div>

</div>

<div class="card grid">

<div class="metric">
Entry
<b id="entry">—</b>
</div>

<div class="metric">
Stop Loss
<b id="sl">—</b>
</div>

<div class="metric">
TP1
<b id="tp1">—</b>
</div>

<div class="metric">
TP2
<b id="tp2">—</b>
</div>

<div class="metric">
R:R
<b id="rr">—</b>
</div>

<div class="metric">
Confidence
<b id="conf">—</b>
</div>

</div>

<div class="card">

<b>Confirmations</b>

<ul id="checks">
<li>Waiting for candles...</li>
</ul>

</div>

<div class="card small">
AUTO TRADE: OFF — Signal-only version. No real-money trading.
</div>

</div>

<script>

let ws = null;
let candles = [];

const $ = id => document.getElementById(id);


/* EMA */

function ema(a,n){

  if(a.length < n)
    return a[a.length-1];

  let k = 2/(n+1);
  let e = a[0];

  for(let i=1;i<a.length;i++){
    e = a[i]*k + e*(1-k);
  }

  return e;
}


/* RSI */

function rsi(a,n=14){

  if(a.length < n+1)
    return 50;

  let g=0;
  let l=0;

  for(let i=a.length-n;i<a.length;i++){

    let d=a[i]-a[i-1];

    g += Math.max(d,0);
    l += Math.max(-d,0);
  }

  if(l===0)
    return 100;

  return 100-(100/(1+g/l));
}


/* ATR */

function atr(c,n=14){

  if(c.length<n+1)
    return 0;

  let s=0;

  for(let i=c.length-n;i<c.length;i++){

    s += Math.max(
      c[i].h-c[i].l,
      Math.abs(c[i].h-c[i-1].c),
      Math.abs(c[i].l-c[i-1].c)
    );

  }

  return s/n;
}


/* Number format */

function fmt(x){

  return Number(x).toLocaleString(
    undefined,
    {
      maximumFractionDigits:8
    }
  );

}


/* SMC ANALYSIS */

function analyze(){

  if(candles.length<60)
    return;

  let c=candles;

  let closes=c.map(x=>x.c);

  let last=c[c.length-1];

  let ema50=ema(closes,50);

  let ema200=ema(
    closes,
    Math.min(200,closes.length)
  );

  let RSI=rsi(closes,14);

  let ATR=atr(c,14);


  /*
  Liquidity area
  */

  let recent=c.slice(-12);

  let highs=recent
    .slice(0,-2)
    .map(x=>x.h);

  let lows=recent
    .slice(0,-2)
    .map(x=>x.l);


  let swingHigh=Math.max(...highs);

  let swingLow=Math.min(...lows);


  /*
  Liquidity Grab
  */

  let liquidityGrabUp =
    last.h > swingHigh &&
    last.c < swingHigh;

  let liquidityGrabDown =
    last.l < swingLow &&
    last.c > swingLow;


  /*
  BOS
  */

  let p=c[c.length-2];

  let pp=c[c.length-3];

  let bullishBOS =
    last.c > p.h &&
    p.h > pp.h;

  let bearishBOS =
    last.c < p.l &&
    p.l < pp.l;


  /*
  FVG
  */

  let bullishFVG =
    c.length>=4 &&
    c[c.length-3].h < c[c.length-1].l;

  let bearishFVG =
    c.length>=4 &&
    c[c.length-3].l > c[c.length-1].h;


  /*
  Scores
  */

  let buyScore =

    (liquidityGrabDown ? 2 : 0) +
    (bullishBOS ? 1 : 0) +
    (bullishFVG ? 2 : 0) +
    (ema50 > ema200 ? 1 : 0) +
    (RSI > 50 ? 1 : 0);


  let sellScore =

    (liquidityGrabUp ? 2 : 0) +
    (bearishBOS ? 1 : 0) +
    (bearishFVG ? 2 : 0) +
    (ema50 < ema200 ? 1 : 0) +
    (RSI < 50 ? 1 : 0);


  /*
  Confirmation display
  */

  document.getElementById("checks").innerHTML = `

  <li>
    Liquidity Grab:
    ${
      liquidityGrabDown || liquidityGrabUp
      ? "✅ Confirmed"
      : "❌ Not confirmed"
    }
  </li>

  <li>
    BOS:
    ${
      bullishBOS || bearishBOS
      ? "✅ Confirmed"
      : "❌ Not confirmed"
    }
  </li>

  <li>
    FVG:
    ${
      bullishFVG || bearishFVG
      ? "✅ Confirmed"
      : "❌ Not confirmed"
    }
  </li>

  <li>
    EMA 50/200:
    ${
      ema50 > ema200
      ? "Bullish 🟢"
      : "Bearish 🔴"
    }
  </li>

  <li>
    RSI 14:
    ${RSI.toFixed(1)}
  </li>

  <li>
    ATR 14:
    ${fmt(ATR)}
  </li>

  `;


  /*
  Signal
  */

  let side=null;

  if(buyScore>=6)
    side="BUY";

  else if(sellScore>=6)
    side="SELL";


  if(!side){

    document.getElementById("signal").textContent=
      "NO SIGNAL";

    document.getElementById("signal").className=
      "signal none";

    document.getElementById("reason").textContent=
      "Waiting for complete SMC confirmation...";

    return;
  }


  /*
  Entry / SL / TP
  */

  let entry=last.c;

  let risk=Math.max(
    ATR*1.2,
    entry*0.001
  );


  let stop;

  let tp1;

  let tp2;


  if(side==="BUY"){

    stop=entry-risk;

    tp1=entry+risk*1.5;

    tp2=entry+risk*2;

  }else{

    stop=entry+risk;

    tp1=entry-risk*1.5;

    tp2=entry-risk*2;

  }


  /*
  UI
  */

  let signalElement=
    document.getElementById("signal");


  signalElement.textContent=
    side==="BUY"
    ? "🟢 BUY — SMC SIGNAL"
    : "🔴 SELL — SMC SIGNAL";


  signalElement.className=
    "signal "+
    (side==="BUY" ? "buy" : "sell");


  document.getElementById("reason").textContent=
    "Liquidity + Structure + FVG + Indicator confirmation";


  document.getElementById("entry").textContent=
    fmt(entry);

  document.getElementById("sl").textContent=
    fmt(stop);

  document.getElementById("tp1").textContent=
    fmt(tp1);

  document.getElementById("tp2").textContent=
    fmt(tp2);

  document.getElementById("rr").textContent=
    "1 : 1.5 / 1 : 2";


  let confidence=
    Math.round(
      Math.max(
        buyScore,
        sellScore
      )/7*100
    );


  document.getElementById("conf").textContent=
    confidence+"%";

}


/* START */

function start(){

  stop();

  let symbol=
    document.getElementById("symbol")
    .value
    .toLowerCase();

  let timeframe=
    document.getElementById("tf")
    .value;


  let url=
    `wss://stream.binance.com:9443/ws/${symbol}@kline_${timeframe}`;


  ws=new WebSocket(url);


  ws.onopen=()=>{

    document.getElementById("status")
      .textContent=
      "🟢 Binance Live";

  };


  ws.onclose=()=>{

    document.getElementById("status")
      .textContent=
      "⚪ Disconnected";

  };


  ws.onerror=()=>{

    document.getElementById("status")
      .textContent=
      "🔴 Connection Error";

  };


  ws.onmessage=e=>{

    let d=JSON.parse(e.data);

    let k=d.k;


    /*
    Only CLOSED candles
    */

    if(k.x){

      candles.push({

        o:+k.o,
        h:+k.h,
        l:+k.l,
        c:+k.c,
        v:+k.v

      });


      if(candles.length>250)
        candles.shift();


      analyze();

    }

  };

}


/* STOP */

function stop(){

  if(ws){

    ws.close();

    ws=null;

  }

  document.getElementById("status")
    .textContent=
    "⚪ Disconnected";

}


/* Start automatically */

start();

</script>

</body>
</html>
